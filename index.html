<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uma pergunta importante 👀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #171717, #3b0a0a, #111);
            overflow: hidden;
        }
        .background-circle {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.08);
            filter: blur(5px);
            animation: float 6s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .circle1 { top: -100px; left: -100px; }
        .circle2 { bottom: -100px; right: -100px; animation-delay: 2s; }
        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(30px); }
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 500px;
            min-height: 360px;
            padding: 40px 25px;
            background: rgba(20, 20, 20, 0.92);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            z-index: 10;
        }
        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 { font-size: 26px; margin-bottom: 12px; }
        p { color: #aaa; margin-bottom: 30px; font-size: 15px; }
        .buttons {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 10px;
        }
        button {
            position: absolute;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #sim {
            background: #27ae60;
            left: 12%;
            top: 30px;
        }
        #nao {
            background: #e74c3c;
            right: 12%;
            top: 30px;
        }
        .final {
            display: none;
        }
        .final.show {
            display: block;
            animation: aparecer 0.6s ease;
        }
        .question.hide {
            display: none;
        }
        .macaco {
            width: 260px;
            max-width: 90%;
            border-radius: 15px;
            margin: 0 auto;
            display: block;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 480px) {
            h1 { font-size: 23px; }
            #sim { left: 5%; }
            #nao { right: 5%; }
        }
    </style>
</head>
<body>
    <div class="background-circle circle1"></div>
    <div class="background-circle circle2"></div>

    <div class="container">
        <div class="question" id="question">
            <div class="emoji">🚿</div>
            <h1>Laís, você tomou banho hoje?</h1>
            <p>Pense bem antes de responder... 👀</p>
            <div class="buttons">
                <button id="sim">SIM</button>
                <button id="nao">NÃO</button>
            </div>
        </div>

        <div class="final" id="final">
            <img src="macaquinho.jpg" alt="Macaquinho" class="macaco">
        </div>
    </div>

    <script>
        const sim = document.getElementById("sim");
        const nao = document.getElementById("nao");
        const question = document.getElementById("question");
        const final = document.getElementById("final");

        function fugir() {
            // Coloca o botão solto na tela
            sim.style.position = "fixed";
            sim.style.zIndex = "9999";

            const maxX = window.innerWidth - sim.offsetWidth - 20;
            const maxY = window.innerHeight - sim.offsetHeight - 20;

            const x = Math.floor(Math.random() * maxX);
            const y = Math.floor(Math.random() * maxY);

            sim.style.left = x + "px";
            sim.style.top = y + "px";
        }

        // ===== BOTÃO SIM =====
        // Funciona no celular e no computador
        sim.addEventListener("pointerdown", function(e) {
            e.preventDefault();
            e.stopPropagation();
            fugir();
        });

        // ===== BOTÃO NÃO =====
        nao.addEventListener("pointerdown", function(e) {
            e.preventDefault();
            e.stopPropagation();
            question.classList.add("hide");
            final.classList.add("show");
        });
    </script>
</body>
</html>
