```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma pergunta importante 👀</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #171717, #3b0a0a, #111);
            overflow: hidden;
        }

        /* Círculos decorativos no fundo */
        .background-circle {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.08);
            filter: blur(5px);
            animation: float 6s infinite alternate ease-in-out;
        }

        .circle1 {
            top: -100px;
            left: -100px;
        }

        .circle2 {
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(30px);
            }
        }

        /* Caixa principal */
        .container {
            position: relative;
            width: 90%;
            max-width: 500px;
            min-height: 360px;
            padding: 45px 30px;
            background: rgba(20, 20, 20, 0.92);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            z-index: 10;
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        p {
            color: #aaa;
            margin-bottom: 35px;
            font-size: 16px;
        }

        /* Área dos botões */
        .buttons {
            position: relative;
            width: 100%;
            height: 100px;
        }

        button {
            position: absolute;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, left 0.2s ease, top 0.2s ease;
        }

        #sim {
            background: #27ae60;
            color: white;
            left: 20%;
            top: 20px;
        }

        #sim:hover {
            transform: scale(1.08);
        }

        #nao {
            background: #e74c3c;
            color: white;
            right: 20%;
            top: 20px;
        }

        #nao:hover {
            transform: scale(1.08);
        }

        /* Tela final */
        .final {
            display: none;
        }

        .final.show {
            display: block;
            animation: aparecer 0.6s ease;
        }

        .question.hide {
            display: none;
        }

        .final-emoji {
            font-size: 75px;
            margin-bottom: 20px;
            animation: aparecer 0.8s ease;
        }

        .final h2 {
            font-size: 45px;
            color: #ff4444;
            margin-bottom: 15px;
        }

        .final p {
            font-size: 18px;
            color: #ddd;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Celular */
        @media (max-width: 500px) {
            .container {
                min-height: 380px;
                padding: 40px 20px;
            }

            h1 {
                font-size: 25px;
            }

            #sim {
                left: 10%;
            }

            #nao {
                right: 10%;
            }
        }
    </style>
</head>

<body>

    <div class="background-circle circle1"></div>
    <div class="background-circle circle2"></div>

    <div class="container">

        <!-- PERGUNTA -->
        <div class="question" id="question">

            <div class="emoji">🚿</div>

            <h1>Você toma banho?</h1>

            <p>
                Pense bem antes de responder... 👀
            </p>

            <div class="buttons">

                <button id="sim">
                    SIM
                </button>

                <button id="nao">
                    NÃO
                </button>

            </div>

        </div>

        <!-- TELA FINAL -->
        <div class="final" id="final">

            <div class="final-emoji">
                😂🚿
            </div>

            <h2>EU SABIA!</h2>

            <p>
                Eu sabia que você não toma banho KKKKKKK
            </p>

        </div>

    </div>

    <script>

        const botaoSim = document.getElementById("sim");
        const botaoNao = document.getElementById("nao");

        const pergunta = document.getElementById("question");
        const final = document.getElementById("final");


        // Função para fazer o botão SIM fugir
        function fugir() {

            const area = document.querySelector(".buttons");

            const larguraMax =
                area.clientWidth - botaoSim.offsetWidth;

            const alturaMax =
                area.clientHeight - botaoSim.offsetHeight;

            // Gera uma posição aleatória
            const novaPosicaoX =
                Math.random() * larguraMax;

            const novaPosicaoY =
                Math.random() * alturaMax;

            botaoSim.style.left = novaPosicaoX + "px";
            botaoSim.style.top = novaPosicaoY + "px";
        }


        // Quando passar o mouse no SIM
        botaoSim.addEventListener("mouseenter", fugir);


        // Também funciona no celular quando tenta tocar
        botaoSim.addEventListener("touchstart", function(event) {

            event.preventDefault();

            fugir();

        });


        // Caso consiga clicar no SIM de alguma forma
        botaoSim.addEventListener("click", function() {

            fugir();

        });


        // Quando clicar no NÃO
        botaoNao.addEventListener("click", function() {

            pergunta.classList.add("hide");

            final.classList.add("show");

        });

    </script>

</body>
</html>
