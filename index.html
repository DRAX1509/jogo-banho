<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boa noite 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #ffcce0, #ffb3d9);
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
            border: 2px solid #ffb6c1;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            color: #d63384;
            margin-bottom: 12px;
        }
        p {
            color: #aa3366;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        button {
            background: linear-gradient(to right, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .tela {
            display: none;
            animation: aparecer 0.6s ease;
        }
        .tela.ativa {
            display: block;
        }
        img {
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            margin: 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .texto-fofo {
            font-size: 20px;
            color: #c2185b;
            font-weight: 600;
            margin: 10px 0 20px;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- TELA 1 - INÍCIO -->
        <div class="tela ativa" id="tela1">
            <div class="emoji">🌙💕</div>
            <h1>Boa noite...</h1>
            <p>Tenho uma coisinha especial pra você</p>
            <button onclick="mostrarTela2()">Clique aqui 🌸</button>
        </div>

        <!-- TELA 2 - PRIMEIRA FOTO -->
        <div class="tela" id="tela2">
            <div class="emoji">🌹</div>
            <div class="texto-fofo">Uma flor pra uma flor 🌷</div>
            <img src="flor.jpg" alt="Gatinho com rosa">
            <br>
            <button onclick="mostrarTela3()" style="margin-top: 15px;">Continuar 💖</button>
        </div>

        <!-- TELA 3 - FOTO FINAL -->
        <div class="tela" id="tela3">
            <div class="emoji">✨</div>
            <img src="princesa.jpg" alt="Boa noite princesa">
            <div class="texto-fofo" style="margin-top: 15px;">Você merece o mundo inteiro 🥹</div>
        </div>

    </div>

    <script>
        function mostrarTela2() {
            document.getElementById("tela1").classList.remove("ativa");
            document.getElementById("tela2").classList.add("ativa");
        }
        function mostrarTela3() {
            document.getElementById("tela2").classList.remove("ativa");
            document.getElementById("tela3").classList.add("ativa");
        }
    </script>
</body>
</html>
