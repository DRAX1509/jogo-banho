<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uma pergunta importante 👀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #171717, #3b0a0a, #111);
            overflow: hidden;
            touch-action: none;
        }
        .background-circle {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.08);
            filter: blur(5px);
            animation: float 6s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .circle1 { top: -100px; left: -100px; }
        .circle2 { bottom: -100px; right: -100px; animation-delay: 2s; }
        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(30px); }
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 500px;
            min-height: 360px;
            padding: 45px 30px;
            background: rgba(20, 20, 20, 0.92);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { color: #aaa; margin-bottom: 35px; font-size: 16px; }
        .buttons { 
            position: relative; 
            width: 100%; 
            height: 110px; 
        }
        button {
            position: absolute;
            border: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
        }
        #sim { 
            background: #27ae60; 
            color: white; 
            left: 15%; 
            top: 25px; 
        }
        #nao { 
            background: #e74c3c; 
            color: white; 
            right: 15%; 
            top: 25px; 
        }
        /* Tela final */
        .final { display: none; }
        .final.show { display: block; animation: aparecer 0.6s ease; }
        .question.hide { display: none; }
        .macaco {
            width: 280px;
            max-width: 90%;
            border-radius: 15px;
            margin: 0 auto;
            display: block;
            animation: aparecer 0.8s ease;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 500px) {
            .container { min-height: 380px; padding: 40px 18px; }
            h1 { font-size: 24px; }
            #sim { left: 8%; }
            #nao { right: 8%; }
            .macaco { width: 230px; }
        }
    </style>
</head>
<body>
    <div class="background-circle circle1"></div>
    <div class="background-circle circle2"></div>
    <div class="container">
        <!-- PERGUNTA -->
        <div class="question" id="question">
            <div class="emoji">🚿</div>
            <h1>Laís, você tomou banho hoje?</h1>
            <p>Pense bem antes de responder... 👀</p>
            <div class="buttons">
                <button id="sim">SIM</button>
                <button id="nao">NÃO</button>
            </div>
        </div>
        <!-- TELA FINAL -->
        <div class="final" id="final">
            <img src="macaquinho.jpg" alt="Macaquinho no banho" class="macaco">
        </div>
    </div>

    <script>
        const botaoSim = document.getElementById("sim");
        const botaoNao = document.getElementById("nao");
        const pergunta = document.getElementById("question");
        const final = document.getElementById("final");

        // Função que faz o SIM fugir
        function fugir(e) {
            if (e) e.preventDefault();

            botaoSim.style.position = "fixed";
            botaoSim.style.zIndex = "9999";

            const btnWidth = botaoSim.offsetWidth;
            const btnHeight = botaoSim.offsetHeight;

            const maxX = window.innerWidth - btnWidth - 10;
            const maxY = window.innerHeight - btnHeight - 10;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            botaoSim.style.left = x + "px";
            botaoSim.style.top = y + "px";
        }

        // Eventos pro botão SIM (funciona no celular e no PC)
        botaoSim.addEventListener("mouseover", fugir);
        botaoSim.addEventListener("touchstart", fugir, { passive: false });
        botaoSim.addEventListener("click", fugir);

        // Evento pro botão NÃO
        function mostrarMacaco(e) {
            if (e) e.preventDefault();
            pergunta.classList.add("hide");
            final.classList.add("show");
        }

        botaoNao.addEventListener("click", mostrarMacaco);
        botaoNao.addEventListener("touchend", mostrarMacaco);
    </script>
</body>
</html>
